<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Botifyr — learned skills library</title>
    <meta
      name="description"
      content="Browse the skills Botifyr bots have learned and shared with the whole team."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .skills-tools {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        margin: 24px auto 8px;
        max-width: 640px;
      }
      .skills-tools input {
        flex: 1;
        background: #121214;
        border: 1px solid #26262b;
        border-radius: 12px;
        padding: 12px 14px;
        color: #e9eaee;
        font-size: 14px;
        outline: none;
      }
      .skills-tools input:focus {
        border-color: #19b7c9;
      }
      .skills-count {
        text-align: center;
        color: #9aa0aa;
        font-size: 13px;
        margin-bottom: 18px;
      }
      .skill-card {
        text-align: left;
      }
      .skill-card h3 {
        margin-bottom: 6px;
      }
      .skill-card p {
        margin: 0;
      }
      .skill-card .tag {
        display: inline-block;
        margin-top: 8px;
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #19b7c9;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="site">
        <a class="brand" href="/">
          <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true">
            <rect
              x="27"
              y="14"
              width="46"
              height="30"
              rx="9"
              fill="#e9eaee"
              stroke="#141416"
              stroke-width="3.4"
            />
            <rect x="40.5" y="23" width="5.5" height="9.5" rx="2.6" fill="#141416" />
            <rect x="54" y="23" width="5.5" height="9.5" rx="2.6" fill="#141416" />
            <path
              d="M13 46h74L61 87.5Q50 95 39 87.5Z"
              fill="#19b7c9"
              stroke="#141416"
              stroke-width="3.4"
              stroke-linejoin="round"
            />
            <path
              d="M29 50h42L56 71.5Q50 77 44 71.5Z"
              fill="#f5a623"
              stroke="#141416"
              stroke-width="3.4"
              stroke-linejoin="round"
            />
          </svg>
          Botifyr
        </a>
        <nav class="links">
          <a href="/skills">Skills</a>
          <a href="/help">Help</a>
          <a href="mailto:support@botifyr.xyz">Contact</a>
        </nav>
      </header>

      <section class="hero">
        <h1>Learned skills library</h1>
        <p>
          Every Botifyr bot can save a capability it figured out. Reviewed and approved skills become part of
          a shared library, so new bots start already trained.
        </p>
      </section>

      <div class="skills-tools">
        <input id="q" type="search" placeholder="Search skills…" autocomplete="off" />
      </div>
      <div class="skills-count" id="count">Loading…</div>

      <section class="grid" id="list"></section>

      <footer class="site">
        <span>© 2026 Botifyr</span>
        <span
          ><a href="/skills">Skills</a> · <a href="/help">Help</a> ·
          <a href="mailto:support@botifyr.xyz">support@botifyr.xyz</a></span
        >
      </footer>
    </div>

    <script>
      // Local dev talks to the compose cloud; production can override with
      // <body data-cloud="https://api.botifyr.xyz">.
      const cloud =
        document.body.dataset.cloud ||
        (location.hostname === "localhost" || location.hostname === "127.0.0.1"
          ? "http://localhost:8787"
          : "https://api.botifyr.xyz");
      const listEl = document.getElementById("list");
      const countEl = document.getElementById("count");
      const qEl = document.getElementById("q");
      const esc = (value) =>
        String(value).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );

      async function load() {
        const q = qEl.value.trim();
        countEl.textContent = "Loading…";
        try {
          const res = await fetch(`${cloud}/public/skills?q=${encodeURIComponent(q)}`);
          const data = await res.json();
          const skills = data.skills ?? [];
          countEl.textContent = q
            ? `${data.count} match${data.count === 1 ? "" : "es"} of ${data.total} skills`
            : `${data.total} skill${data.total === 1 ? "" : "s"} in the library`;
          listEl.innerHTML = skills.length
            ? skills
                .map(
                  (skill) => `<div class="card skill-card">
                    <h3>${esc(skill.name)}</h3>
                    <p>${esc(skill.description)}</p>
                    <span class="tag">Learned by the team</span>
                  </div>`,
                )
                .join("")
            : `<div class="card skill-card"><h3>Nothing yet</h3><p>No approved skills match that search.</p></div>`;
        } catch {
          countEl.textContent = "Couldn't reach the skill library.";
          listEl.innerHTML = "";
        }
      }

      let timer;
      qEl.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(load, 200);
      });
      load();
    </script>
  </body>
</html>
