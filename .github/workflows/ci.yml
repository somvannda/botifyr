name: CI

# The merge gate. Green here = safe to merge (see AGENTS.md §8/§9).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs so a fast-follow push doesn't queue behind a stale
# one. Main runs are never cancelled (a red main must stay visible).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# --- Self-hosted runner (optional; recommended for a private repo) ---------------
# GitHub-hosted Actions minutes are capped (2,000/mo on Free, 3,000 on Pro) and
# this repo's parallel PR + main-push runs use them fast. Self-hosted minutes are
# free. To switch: register a runner on the host with the `botifyr` label, then
#   gh variable set CI_RUNNER --body '["self-hosted","botifyr"]'
# While CI_RUNNER is unset, jobs fall back to ubuntu-latest, so this is safe to
# land before the runner exists.

jobs:
  checks:
    name: Typecheck / Lint / Test
    # Runs on a self-hosted runner once the repo variable CI_RUNNER is set
    # (e.g. ["self-hosted","botifyr"]) — self-hosted minutes are free, which is
    # the fix for the 2,000-min/month Free ceiling. Until then, GitHub-hosted.
    runs-on: ${{ vars.CI_RUNNER != '' && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build libraries
        run: |
          npm run build -w @botifyr/shared --if-present
          npm run build -w @botifyr/agent-core --if-present
          npm run build -w @botifyr/channels --if-present

  cloud:
    name: Cloud image
    # Same runner selection as `checks` — see above.
    runs-on: ${{ vars.CI_RUNNER != '' && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build cloud image
        run: docker build -f apps/cloud/Dockerfile -t botifyr-cloud:ci .

  # Continuous deploy: after a merge to main (and only once checks + the cloud
  # image build pass), rebuild the running Docker stack on the host.
  #
  # GitHub-hosted runners can't reach the host's Docker daemon, so this job runs
  # on a self-hosted runner (label: botifyr) installed on the deploy host.
  # One-time setup:
  #   1. Register a self-hosted runner on the host with the label `botifyr`
  #      (Settings -> Actions -> Runners -> New self-hosted runner).
  #   2. Set the repository variable BOTIFYR_DEPLOY_DIR to the checkout that runs
  #      the stack (e.g. /srv/botifyr or G:\Developments\botifyr.xyz) and make
  #      sure its apps/cloud/.env exists (it is gitignored).
  # Until BOTIFYR_DEPLOY_DIR is set the job is skipped, so main stays green.
  deploy:
    name: Deploy (self-hosted)
    needs: [checks, cloud]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.BOTIFYR_DEPLOY_DIR != ''
    runs-on: [self-hosted, botifyr]
    steps:
      - name: Update the deploy checkout
        shell: bash
        working-directory: ${{ vars.BOTIFYR_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git checkout main
          git pull --ff-only

      - name: Rebuild the running stack
        shell: bash
        working-directory: ${{ vars.BOTIFYR_DEPLOY_DIR }}
        run: docker compose up -d --build
