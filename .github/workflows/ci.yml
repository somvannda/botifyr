name: CI

# The merge gate. Green here = safe to merge (see AGENTS.md §8/§9).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs so a fast-follow push doesn't queue behind a stale
# one. Main runs are never cancelled (a red main must stay visible).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build libraries
        run: |
          npm run build -w @botifyr/shared --if-present
          npm run build -w @botifyr/agent-core --if-present
          npm run build -w @botifyr/channels --if-present

  cloud:
    name: Cloud image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build cloud image
        run: docker build -f apps/cloud/Dockerfile -t botifyr-cloud:ci .
