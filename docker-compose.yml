# Botifyr stack.
#
#   docker compose up -d --build      # postgres + cloud (always on)
#   docker compose logs -f cloud
#   docker compose down               # stop (keeps data)
#
# The cloud is built from apps/cloud/Dockerfile, reads apps/cloud/.env for
# secrets, and spawns per-task sandbox containers on the shared botifyr-net
# network via the mounted Docker socket.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: botifyr-postgres
    environment:
      POSTGRES_USER: botifyr
      POSTGRES_PASSWORD: botifyr
      POSTGRES_DB: botifyr
    ports:
      - "54329:5432"
    volumes:
      - botifyr-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botifyr"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - botifyr

  cloud:
    build:
      context: .
      dockerfile: apps/cloud/Dockerfile
    container_name: botifyr-cloud
    restart: unless-stopped
    env_file:
      - apps/cloud/.env
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      BOTIFYR_STORE: postgres
      DATABASE_URL: postgres://botifyr:botifyr@postgres:5432/botifyr
      BOTIFYR_SANDBOX: docker
      BOTIFYR_SANDBOX_NETWORK: botifyr-net
      BOTIFYR_DEMO_URL: http://cloud:8787/demo
      # Where connected code checkouts live (docs/codebase-access.md).
      BOTIFYR_REPOS_DIR: /repos
      # Writable area where engineering agents stage proposed changes (Phase 2).
      BOTIFYR_WORK_DIR: /work
    ports:
      - "8787:8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - botifyr-downloads:/downloads
      # Read-only host directory the engineering agents may read through the
      # code.* tools. Point BOTIFYR_REPOS_HOST at a checkout (see .env.example)
      # and it appears at /repos inside the container; connect /repos in the HQ.
      - "${BOTIFYR_REPOS_HOST:-./repos}:/repos:ro"
      # Writable scratch for staged code changes (never the host repo).
      - botifyr-work:/work
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - botifyr

  # Website + user portal: marketing pages at `/`, the React portal at `/portal`.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CLOUD_URL: ${VITE_CLOUD_URL:-http://localhost:8787}
    container_name: botifyr-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4322}:80"
    networks:
      - botifyr

  # Platform admin console (separate app; run it on its own host/subdomain).
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_CLOUD_URL: ${VITE_CLOUD_URL:-http://localhost:8787}
    container_name: botifyr-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-4324}:80"
    networks:
      - botifyr

networks:
  botifyr:
    name: botifyr-net

volumes:
  botifyr-pg:
  botifyr-downloads:
    name: botifyr-downloads
  botifyr-work:
